name: policy

# Who may change this repository and how it may be worded.
#
# Changes reach master by pull request only (the branch ruleset). A pull
# request is accepted only when it was opened by the release identity,
# masseuse-ai[bot], from a branch of this repository, with commits GitHub
# signed for that identity (policy-identity), and when its title, body,
# commit messages, changed paths and added lines pass .github/scripts/policy.mjs
# (policy-text). The same wording check runs on every push to master and to
# a release tag, over the whole tree, and on every release's notes
# (policy-release). A pull request opened by anyone else is closed
# (close-external-prs): this repository does not take contributions.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_target:
    types: [opened, reopened]
  push:
    branches: [master]
    tags: ["v*"]
  release:
    types: [created, published, edited, prereleased, released]

permissions:
  contents: read

env:
  RELEASE_IDENTITY: masseuse-ai[bot]

jobs:
  policy-identity:
    name: policy-identity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: The pull request is the release identity's, from this repository, with verified commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$AUTHOR" != "$RELEASE_IDENTITY" ] || [ "$AUTHOR_TYPE" != "Bot" ]; then
            echo "::error::pull request #$PR was not opened by $RELEASE_IDENTITY"; exit 1
          fi
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::pull request #$PR comes from another repository"; exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[] | [.sha, (.author.login // "-"), (.commit.committer.email // "-"), (.commit.verification.verified | tostring)] | @tsv' > commits.tsv
          bad=0
          while IFS=$'\t' read -r sha login committer verified; do
            if [ "$login" != "$RELEASE_IDENTITY" ] || [ "$committer" != "noreply@github.com" ] || [ "$verified" != "true" ]; then
              echo "::error::commit $sha: author=$login committer=$committer verified=$verified"; bad=1
            fi
          done < commits.tsv
          [ "$bad" = 0 ]
          echo "$(wc -l < commits.tsv | tr -d ' ') commit(s) by $RELEASE_IDENTITY, all signed and verified"

  policy-text:
    name: policy-text
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pull request title, body and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/policy
          printf '%s\n' "$PR_TITLE" > /tmp/policy/pr-title.md
          printf '%s\n' "$PR_BODY" > /tmp/policy/pr-body.md
          i=0
          for sha in $(git rev-list --reverse "$BASE_SHA".."$HEAD_SHA"); do
            i=$((i + 1)); git log -1 --format=%B "$sha" > "/tmp/policy/commit-$i.md"
          done
          node .github/scripts/policy.mjs text /tmp/policy/*.md
          node .github/scripts/policy.mjs diff "$BASE_SHA" "$HEAD_SHA"
      - name: Pushed commits, their messages and the whole tree
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != "$RELEASE_IDENTITY" ]; then
            echo "::error::${GITHUB_REF} was pushed by $ACTOR, not by $RELEASE_IDENTITY"; exit 1
          fi
          mkdir -p /tmp/policy
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            i=0
            for sha in $(git rev-list --reverse "$BEFORE".."$AFTER"); do
              i=$((i + 1)); git log -1 --format=%B "$sha" > "/tmp/policy/commit-$i.md"
            done
            node .github/scripts/policy.mjs diff "$BEFORE" "$AFTER"
          else
            git log -1 --format=%B "$AFTER" > /tmp/policy/commit-1.md
          fi
          node .github/scripts/policy.mjs text /tmp/policy/*.md
          node .github/scripts/policy.mjs tree

  policy-release:
    name: policy-release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: The release's name and notes
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/policy
          printf '%s\n' "$RELEASE_NAME" > /tmp/policy/release-name.md
          printf '%s\n' "$RELEASE_BODY" > /tmp/policy/release-body.md
          node .github/scripts/policy.mjs text /tmp/policy/release-name.md /tmp/policy/release-body.md
          echo "release $RELEASE_TAG: notes ok"

  close-external-prs:
    name: close-external-prs
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login != 'masseuse-ai[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Close a pull request that is not the release identity's
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY" --delete-branch=false \
            --comment "Thank you for your interest. This repository is published for review and verification; it does not take contributions, and changes are made only by the project's release identity. Vulnerabilities: please use the security advisory form linked from SECURITY.md."
