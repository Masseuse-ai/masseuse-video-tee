# The masseuse-camlink-gateway release the enclave image carries
# (github.com/FemLed/masseuse-camlink). build.sh passes both values to
# Dockerfile.tee, which reproduces the binary with `go install` at the tag
# and refuses to build unless its sha256 equals the one below: the line
# "masseuse-camlink-gateway_<version>_linux_amd64" of that release's
# checksums.txt, which is signed keyless by the release workflow and covered
# by its SLSA provenance (masseuse-camlink/VERIFY.md).
#
# To roll the gateway: change both lines, then follow docs/OPERATIONS.md
# "Rolling an image" (a new release; the deployment's digest pin changes).
CAMLINK_VERSION=v0.14.0
CAMLINK_SHA256=c3cdc1136aeabd4cde918f7696ffc53447cdd633deb60ace16876b3b33ddd7a5
